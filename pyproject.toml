[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "liner"
version = "0.1.0"
description = "Explore music through the people behind it, with a reason for every suggestion."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
liner = "liner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
